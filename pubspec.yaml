name: music_player
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+3

environment:
  sdk: '>=3.0.0 <=3.29.1'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0 # MIT
  path: ^1.8.2 # BSD-3-Clause
  path_provider: ^2.0.13 # BSD-3-Clause
  audioplayers: # MIT
    git:
      url: https://github.com/motobep/audioplayers.git
      ref: v5_with_equalizer
      path: packages/audioplayers
  audioplayers_android_exo:
    git:
      url: https://github.com/motobep/audioplayers.git
      ref: v5_with_equalizer
      path: packages/audioplayers_android_exo
  mp3_info: ^0.2.1 # MIT
  id3tag: ^0.2.0 # MIT
  dart_tags: ^0.4.0 # MIT
  file_picker: ^9.0.2 # MIT
  permission_handler: ^11.4.0 # MIT
  photo_manager: ^3.12.0
  window_manager: ^0.3.1 # MIT
  device_info_plus: ^11.1.0 # BSD-3-Clause
  flutter_cache_manager: ^3.3.0 # MIT
  audio_service: 0.18.18 # MIT
  audio_service_mpris: ^0.2.0
  audio_session: 0.2.2 # MIT
  flutter_js: # MIT
    git:
      url: https://github.com/motobep/flutter_js.git
      ref: dart_quickjs
  # http: ^1.0.0 # BSD-3-Clause 
  archive: ^3.4.5 # MIT
  phosphor_flutter: ^2.1.0 # MIT
  flutter_colorpicker: ^1.1.0 # MIT
  file: ^6.0.1 # BSD-3-Clause
  intl: ^0.20.2 # BSD-3-Clause
  carousel_slider: ^5.1.1 # MIT License
  flutter_zoom_drawer: ^3.2.0 # MIT
  flutter_advanced_drawer: ^1.5.0 # BSD-3
  webview_flutter: ^4.13.0
  webview_cookie_manager:
    git:
      url: https://github.com/fryette/webview_cookie_manager.git
      ref: master
  collection: ^1.19.1
  crypto: ^3.0.6

  m4a_tags_handler:
    path: ./libraries/m4a_tags_handler

dependency_overrides:
  audioplayers_platform_interface:
    git:
      url: https://github.com/motobep/audioplayers.git
      ref: v5_with_equalizer
      path: packages/audioplayers_platform_interface
  audioplayers_linux:
    git:
      url: https://github.com/motobep/audioplayers.git
      ref: v5_with_equalizer
      path: packages/audioplayers_linux
  audioplayers_windows:
    git:
      url: https://github.com/motobep/audioplayers.git
      ref: v5_with_equalizer
      path: packages/audioplayers_windows

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: "^0.14.3" # MIT license

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo_mp_512.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo_mp_512_gaps.png"
    icon_size: 256

flutter:
  assets:
    - assets/
    - assets/images/
    - assets/images/animations/
    - assets/libresound_js_libs/

  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: "assets/fonts/Roboto-VariableFont_wdth,wght.ttf"
        - asset: "assets/fonts/Roboto-Italic-VariableFont_wdth,wght.ttf"
          style: italic
